name: 運彩資料更新

on:
  schedule:
    - cron: "7 * * * *"      # 每小時一次（UTC），只在預設分支上生效
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/sports-data.yml"

permissions:
  contents: write

concurrency:
  group: sports-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r pipeline/requirements.txt

      - name: 抓資料
        run: python pipeline/fetch.py --debug-dir debug
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # AI 分析用（Google AI Studio 免費申請）；沒設就不寫 AI 分析


      - name: 保留原始資料樣本（除錯用，3 天後自動刪）
        uses: actions/upload-artifact@v4
        with:
          name: espn-raw-samples
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

      - name: 顯示摘要
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("data/today.json", encoding="utf-8"))
          print("更新時間", d["generated_at"], "賽事", len(d["games"]), "傷兵", len(d["injury_feed"]), "火燙/冰冷", len(d["hot_players"]))
          from collections import Counter
          print(Counter(g["league"] for g in d["games"]))
          for e in d.get("errors", [])[:30]:
              print("  !", e)
          EOF

      - name: 提交結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/today.json /tmp/today.json
          cp data/history.json /tmp/history.json 2>/dev/null || true
          cp data/results.json /tmp/results.json 2>/dev/null || true
          cp data/ai_notes.json /tmp/ai_notes.json 2>/dev/null || true
          cp data/tsdb.json /tmp/tsdb.json 2>/dev/null || true
          cp data/espn_games.json /tmp/espn_games.json 2>/dev/null || true
          cp data/el_box.json /tmp/el_box.json 2>/dev/null || true
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            cp /tmp/today.json data/today.json
            [ -f /tmp/history.json ] && cp /tmp/history.json data/history.json
            [ -f /tmp/results.json ] && cp /tmp/results.json data/results.json
            [ -f /tmp/ai_notes.json ] && cp /tmp/ai_notes.json data/ai_notes.json
            [ -f /tmp/tsdb.json ] && cp /tmp/tsdb.json data/tsdb.json
            [ -f /tmp/espn_games.json ] && cp /tmp/espn_games.json data/espn_games.json
            [ -f /tmp/el_box.json ] && cp /tmp/el_box.json data/el_box.json
            git add data/today.json data/history.json data/results.json
            [ -f data/ai_notes.json ] && git add data/ai_notes.json
            [ -f data/tsdb.json ] && git add data/tsdb.json
            [ -f data/espn_games.json ] && git add data/espn_games.json
            [ -f data/el_box.json ] && git add data/el_box.json
            if git diff --cached --quiet; then
              echo "資料沒有變化，不提交"
              exit 0
            fi
            git commit -q -m "更新運彩資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "已提交"
              exit 0
            fi
            echo "推送失敗，重試 $i"
            sleep 5
          done
          exit 1
