<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="跑步中的爸爸娃娃，資料載入中">
  <style>
    .ol{stroke:#2a1f1e;stroke-width:3.6;stroke-linejoin:round;stroke-linecap:round}
    .thin{stroke:#2a1f1e;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;fill:none}
    #body{animation:bob .32s ease-in-out infinite}
    #head{transform-origin:130px 118px;animation:nod .64s ease-in-out infinite}
    #tuft{transform-origin:150px 40px;animation:tuft .32s ease-in-out infinite}
    #armL{transform-origin:84px 150px;animation:armL .64s ease-in-out infinite}
    #armR{transform-origin:176px 150px;animation:armR .64s ease-in-out infinite}
    #legL{animation:legL .64s ease-in-out infinite}
    #legR{animation:legR .64s ease-in-out infinite}
    #shoeL{transform-origin:112px 268px;animation:shoeL .64s ease-in-out infinite}
    #shoeR{transform-origin:148px 268px;animation:shoeR .64s ease-in-out infinite}
    #thighL{transform-origin:112px 225px;animation:thighL .64s ease-in-out infinite}
    #thighR{transform-origin:148px 225px;animation:thighR .64s ease-in-out infinite}
    .puff{animation:puff .64s ease-out infinite}
    .puff.b{animation-delay:-.32s}
    .zoom line{stroke:#2a1f1e;stroke-width:3;stroke-linecap:round;opacity:.55;animation:zoom .64s linear infinite}
    .zoom line:nth-child(2){animation-delay:-.16s}
    .zoom line:nth-child(3){animation-delay:-.32s}
    .zoom line:nth-child(4){animation-delay:-.48s}
    #ground{stroke-dasharray:14 10;animation:ground .4s linear infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes nod{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    @keyframes tuft{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
    @keyframes armL{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(34deg)}}
    @keyframes armR{0%,100%{transform:rotate(38deg)}50%{transform:rotate(-34deg)}}
    @keyframes legL{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
    @keyframes legR{0%,100%{transform:translateY(-22px)}50%{transform:translateY(0)}}
    @keyframes thighL{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.62)}}
    @keyframes thighR{0%,100%{transform:scaleY(.62)}50%{transform:scaleY(1)}}
    @keyframes shoeL{0%,100%{transform:scale(1)}50%{transform:scale(1.28) translateY(2px)}}
    @keyframes shoeR{0%,100%{transform:scale(1.28) translateY(2px)}50%{transform:scale(1)}}
    @keyframes puff{0%{transform:translate(0,0) scale(.3);opacity:.9}100%{transform:translate(-26px,8px) scale(1.4);opacity:0}}
    .zoom.r line{animation-name:zoomr}
    @keyframes zoom{0%{transform:translateX(0);opacity:.6}100%{transform:translateX(-70px);opacity:0}}
    @keyframes zoomr{0%{transform:translateX(0);opacity:.6}100%{transform:translateX(70px);opacity:0}}
    @keyframes ground{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:4s!important}}
  </style>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.6" fill="#e6cfa3"/></pattern>
    <clipPath id="jersey"><path d="M96 170 Q96 158 108 156 L152 156 Q164 158 164 170 L164 216 L96 216 Z"/></clipPath>
    <clipPath id="iris"><circle cx="130" cy="150" r="124"/></clipPath>
  </defs>

  <!-- 復古圓形底（奶油色＋網點） -->
  <circle cx="130" cy="150" r="124" fill="#f7ead0"/>
  <circle cx="130" cy="150" r="124" fill="url(#dots)"/>
  <g clip-path="url(#iris)">
    <!-- 速度線 -->
    <g class="zoom">
      <line x1="60" y1="120" x2="20" y2="120"/>
      <line x1="56" y1="146" x2="10" y2="146"/>
      <line x1="62" y1="172" x2="24" y2="172"/>
      <line x1="58" y1="198" x2="14" y2="198"/>
    </g>
    <g class="zoom r">
      <line x1="200" y1="120" x2="240" y2="120"/>
      <line x1="204" y1="146" x2="250" y2="146"/>
      <line x1="198" y1="172" x2="236" y2="172"/>
      <line x1="202" y1="198" x2="246" y2="198"/>
    </g>
    <!-- 地面 -->
    <line id="ground" x1="0" y1="276" x2="260" y2="276" stroke="#2a1f1e" stroke-width="3"/>
    <!-- 灰塵 -->
    <g fill="#d9c69a" stroke="#2a1f1e" stroke-width="2">
      <circle class="puff" cx="104" cy="270" r="7"/>
      <circle class="puff b" cx="160" cy="270" r="7"/>
    </g>

    <!-- 腿（後面）-->
    <g id="legR">
      <g id="thighR"><rect x="138" y="222" width="20" height="30" rx="9" fill="#efb98c" class="ol"/></g>
      <rect x="139" y="246" width="18" height="20" rx="6" fill="#fbfaf5" class="ol"/>
      <rect x="139" y="252" width="18" height="4" fill="#1e3d8f"/><rect x="139" y="258" width="18" height="3" fill="#d8372f"/>
      <g id="shoeR"><ellipse cx="148" cy="270" rx="15" ry="9" fill="#fbfaf5" class="ol"/></g>
    </g>
    <g id="legL">
      <g id="thighL"><rect x="102" y="222" width="20" height="30" rx="9" fill="#efb98c" class="ol"/></g>
      <rect x="103" y="246" width="18" height="20" rx="6" fill="#fbfaf5" class="ol"/>
      <rect x="103" y="252" width="18" height="4" fill="#1e3d8f"/><rect x="103" y="258" width="18" height="3" fill="#d8372f"/>
      <g id="shoeL"><ellipse cx="112" cy="270" rx="15" ry="9" fill="#fbfaf5" class="ol"/></g>
    </g>

    <g id="body">
      <!-- 後手 -->
      <g id="armR"><rect x="166" y="146" width="18" height="48" rx="9" fill="#efb98c" class="ol"/><rect x="164" y="146" width="22" height="20" rx="8" fill="#1e3d8f" class="ol"/></g>
      <!-- 短褲 -->
      <path d="M98 208 L162 208 L166 236 L134 236 L130 226 L126 236 L94 236 Z" fill="#fbfaf5" class="ol"/>
      <!-- 球衣 -->
      <path d="M96 170 Q96 158 108 156 L152 156 Q164 158 164 170 L164 216 L96 216 Z" fill="#1e3d8f" class="ol"/>
      <g clip-path="url(#jersey)" fill="none" stroke="#4a7bd6" stroke-width="3">
        <path d="M96 176 L112 166 L130 178 L148 166 L164 176"/>
        <path d="M96 190 L112 180 L130 192 L148 180 L164 190"/>
        <path d="M96 204 L112 194 L130 206 L148 194 L164 204"/>
        <path d="M96 218 L112 208 L130 220 L148 208 L164 218"/>
      </g>
      <!-- 領口 -->
      <path d="M112 156 L130 174 L148 156" fill="none" stroke="#d8372f" stroke-width="5"/>
      <path d="M112 156 L130 174 L148 156" fill="none" stroke="#fbfaf5" stroke-width="2"/>
      <!-- 隊徽：小公雞＋兩顆星 -->
      <g transform="translate(146 184)">
        <path d="M0 -6 l3 -4 l1 3 l3 -2 l-1 4 q5 2 3 7 q-3 4 -8 2 l-2 4 l-2 -4 q-5 -1 -4 -6 q1 -4 7 -4 z" fill="#d5a93b" stroke="#2a1f1e" stroke-width="1.2"/>
        <path d="M-6 -11 l1 2 l2 0 l-1.6 1.2 l.6 2 l-2 -1.3 l-2 1.3 l.6 -2 l-1.6 -1.2 l2 0 z M3 -11 l1 2 l2 0 l-1.6 1.2 l.6 2 l-2 -1.3 l-2 1.3 l.6 -2 l-1.6 -1.2 l2 0 z" fill="#d5a93b"/>
      </g>
      <!-- 前手 -->
      <g id="armL"><rect x="76" y="146" width="18" height="48" rx="9" fill="#efb98c" class="ol"/><rect x="74" y="146" width="22" height="20" rx="8" fill="#1e3d8f" class="ol"/></g>

      <!-- 頭 -->
      <g id="head">
        <circle cx="76" cy="124" r="11" fill="#efb98c" class="ol"/>
        <circle cx="184" cy="124" r="11" fill="#efb98c" class="ol"/>
        <circle cx="130" cy="112" r="54" fill="#efb98c" class="ol"/>
        <!-- 鬍碴 -->
        <path d="M86 128 Q96 160 130 164 Q164 160 174 128 Q160 146 130 148 Q100 146 86 128 Z" fill="#2a1f1e" opacity=".18"/>
        <g fill="#2a1f1e" opacity=".45"><circle cx="100" cy="140" r="1.4"/><circle cx="110" cy="150" r="1.4"/><circle cx="122" cy="156" r="1.4"/><circle cx="138" cy="156" r="1.4"/><circle cx="150" cy="150" r="1.4"/><circle cx="160" cy="140" r="1.4"/><circle cx="130" cy="160" r="1.4"/></g>
        <!-- 頭髮 -->
        <path d="M78 104 Q74 46 130 42 Q188 44 182 106 Q176 92 168 84 L172 70 Q160 76 150 68 L152 56 Q140 66 126 62 L120 50 Q112 64 98 66 L90 58 Q88 74 80 86 Z" fill="#1d1a1f" class="ol"/>
        <path d="M82 100 Q100 72 136 74 Q164 76 178 100 Q166 90 144 88 Q112 86 82 100 Z" fill="#1d1a1f"/>
        <g id="tuft"><path d="M138 50 Q146 28 176 34 Q160 40 164 54 Q152 46 138 50 Z" fill="#1d1a1f" class="ol"/></g>
        <!-- 眉毛 -->
        <path d="M94 86 Q106 78 120 84" class="thin" stroke-width="4"/>
        <path d="M140 84 Q154 78 166 86" class="thin" stroke-width="4"/>
        <!-- 眼鏡＋眼睛 -->
        <rect x="90" y="92" width="32" height="24" rx="5" fill="#ffffff" fill-opacity=".35" stroke="#c8a44b" stroke-width="3"/>
        <rect x="138" y="92" width="32" height="24" rx="5" fill="#ffffff" fill-opacity=".35" stroke="#c8a44b" stroke-width="3"/>
        <path d="M122 102 L138 102 M90 100 L82 96 M170 100 L178 96" stroke="#c8a44b" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="106" cy="105" r="6.5" fill="#2a1f1e"/><circle cx="108" cy="103" r="2" fill="#fff"/>
        <circle cx="154" cy="105" r="6.5" fill="#2a1f1e"/><circle cx="156" cy="103" r="2" fill="#fff"/>
        <!-- 鼻子 -->
        <path d="M126 118 Q130 124 134 118" class="thin"/>
        <!-- 大笑 -->
        <path d="M104 132 Q130 160 156 132 Q130 142 104 132 Z" fill="#a0322e" class="ol"/>
        <path d="M108 134 Q130 146 152 134 L150 138 Q130 148 110 138 Z" fill="#fff"/>
        <path d="M118 150 Q130 156 142 150 Q130 150 118 150 Z" fill="#d8372f"/>
      </g>
    </g>
  </g>
  <!-- 外框 -->
  <circle cx="130" cy="150" r="124" fill="none" stroke="#2a1f1e" stroke-width="6"/>
  <circle cx="130" cy="150" r="118" fill="none" stroke="#fbfaf5" stroke-width="2" opacity=".7"/>
</svg>
