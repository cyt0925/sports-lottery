<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>載入動畫預覽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0a14;font-family:"Noto Sans TC",sans-serif;color:#fff}
.wrap{text-align:center}
.wrap img{width:min(70vw,300px);height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.t{margin-top:18px;font-weight:900;font-size:1.3rem;letter-spacing:.2em}
.t i{display:inline-block;animation:blink 1.2s infinite;font-style:normal}
.t i:nth-child(2){animation-delay:.2s}.t i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.light{background:#f3f1fb;color:#1c1536}
</style></head>
<body><div class="wrap"><img src="loader.svg" alt=""><div class="t">資料載入中<i>.</i><i>.</i><i>.</i></div></div></body></html>
